[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "off-websec-rag"
version = "0.1.0"
description = "Simple RAG for official web attack resources"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0",
  "pypdf>=5.0.0",
  "chromadb>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
